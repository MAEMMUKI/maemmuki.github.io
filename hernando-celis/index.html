body{margin:0;min-height:100vh;font-family:'Inter',system-ui,sans-serif;color:#141416;-webkit-font-smoothing:antialiased;background:#1d1f23;padding:22px 16px 30px}
.c{position:relative;max-width:420px;margin:0 auto;background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, rgba(0,0,0,.03) 1px 3px), linear-gradient(135deg,#f1f3f5 0%,#bcc1c8 22%,#eceef1 46%,#a9afb7 70%,#e1e4e8 100%);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 50px 80px -30px rgba(0,0,0,.65),0 18px 30px -18px rgba(0,0,0,.35);}

.c::after{content:"";position:absolute;inset:9px;border:1px solid #7a7d82;border-radius:4px;pointer-events:none}

.hd{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px 14px;min-height:62px;background:transparent;}

.lgw{display:inline-flex;max-width:62%}.lgw.plate{background:#fff;padding:6px 10px;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.lg{height:31px;width:auto;max-width:100%;object-fit:contain;display:block}
.lgw{display:inline-flex;flex:none;max-width:72%;transform:translate(-6px,-4px)}
.lgw img{object-position:left top}

.lgn{display:flex;justify-content:center;margin:4px 0 18px}.lgn .lgw{max-width:90%}
.lgt{font-family:'Archivo',system-ui,sans-serif;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#626367}

.me{padding:10px 22px 4px;text-align:center}
.ph{width:118px;height:118px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;box-shadow:0 0 0 4px #cdd1d7,0 0 0 5px #bbbec4,0 14px 28px -16px rgba(0,0,0,.5)}
.phw{overflow:hidden}.phw img{width:100%;height:100%;object-fit:cover;display:block}
.ini{display:grid;place-items:center;background:rgba(255,255,255,.42);color:#141416;font-family:'Archivo',system-ui,sans-serif;font-size:38px;font-weight:600}

.me h1{text-shadow:0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.18);}
.ti{margin:8px 0 0;font-size:15px;color:#626367;font-weight:500}
.co{margin:6px 0 0;font-size:11.5px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#15171a}
.dv{width:36px;height:2px;background:#15171a;margin:16px auto 0;opacity:1}
.bio{margin:14px auto 0;font-size:14.5px;line-height:1.55;color:#626367;max-width:320px}
.sv{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px 22px 0;background:#15171a;color:#f5f5f7;text-decoration:none;font-weight:600;font-size:15.5px;border-radius:10px;padding:15px;letter-spacing:.08em;text-transform:uppercase;font-size:13.5px;}
.sv svg{width:19px;height:19px}
.q{display:flex;justify-content:center;gap:24px;padding:22px 16px 4px}
.q a{display:grid;justify-items:center;gap:7px;text-decoration:none;color:#141416;font-size:12.5px;font-weight:500;min-width:56px}
.qi{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.42);color:#141416;display:grid;place-items:center;border:1px solid #bbbec4}
.qi svg{width:21px;height:21px}
.l{margin:20px 22px 0;border-top:1px solid #bbbec4}
.l a{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid #bbbec4;text-decoration:none;color:#141416;font-size:15px;font-weight:500}
.li{width:34px;height:34px;border-radius:6px;background:rgba(255,255,255,.42);color:#141416;display:grid;place-items:center;flex:none}.li svg{width:17px;height:17px}
.lt{flex:1}.lc{color:#626367;display:grid}.lc svg{width:18px;height:18px}
em{font-style:normal;font-size:11px;color:#e0622a}
.ft{padding:24px 20px 26px;text-align:center}
