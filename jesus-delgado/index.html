    var li = val('linkedin'); if (li) L.push('URL;TYPE=LinkedIn:'+li);
    if (adr) L.push('ADR;TYPE=WORK:;;'+e(adr)+';;;;');
    L.push('URL;TYPE=Tarjeta:'+location.href.split('#')[0]);
    if (D.photo && /^data:image\/jpeg;base64,/.test(D.photo)) L.push('PHOTO;ENCODING=b;TYPE=JPEG:'+D.photo.split(',')[1]);
    L.push('END:VCARD');
    var blob = new Blob([L.join('\r\n')], {type:'text/vcard;charset=utf-8'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (D.name||'contacto').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-') + '.vcf';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  });
  var sh = document.getElementById('share');
  if (sh) sh.addEventListener('click', function(){
    var u = location.href.split('#')[0];
    if (navigator.share) navigator.share({title:D.name, text:(D.title?D.title+' · ':'')+(D.company||''), url:u}).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ sh.classList.add('ok'); setTimeout(function(){ sh.classList.remove('ok'); }, 1600); });
  });
})()</script></body></html>
